[user]
name = "Cody Hiar"
email = "cody@hiar.ca"

[ui]
pager = ["less", "-FRX"]
diff-formatter="delta"

# Anything that's been pushed (tracked remote bookmarks) becomes immutable.
# builtin_immutable_heads() already covers trunk(), tags() and untracked remotes.
[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks()"

[templates]
git_push_bookmark = '"ch/" ++ change_id.short()'

[merge-tools.delta]
diff-args=["--side-by-side", "$left", "$right", "--width=$width"]
diff-expected-exit-codes = [0, 1]

[remotes.origin]
auto-track-bookmarks = "glob:*"
